name: Build Windows (single-file exe)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "指定版本号 (如 0.1.2)。留空则自动按小版本(patch)自增"
        required: false
        default: ""

# 自增版本后需要把改动写回仓库，故授予 contents 写权限
permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows exe
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install frontend deps
        run: npm ci

      # 自增版本：手动填 version 输入则用填写值，否则读取 package.json 的 patch +1
      # 并同步写回 package.json / tauri.conf.json / Cargo.toml 三处（必须一致）
      - name: Bump version
        id: ver
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const conf = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            const cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
            const input = process.env.VERSION_INPUT || "";
            let v = input || pkg.version;
            if (!input) {
              const parts = pkg.version.split(".");
              const pat = parseInt(parts[2] || "0", 10);
              v = parts[0] + "." + parts[1] + "." + (pat + 1);
            }
            pkg.version = v;
            conf.version = v;
            const newCargo = cargo.replace(/^version = ".*"$/m, `version = "${v}"`);
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            fs.writeFileSync("src-tauri/tauri.conf.json", JSON.stringify(conf, null, 2) + "\n");
            fs.writeFileSync("src-tauri/Cargo.toml", newCargo);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "version=" + v + "\n");
            console.log("Version -> " + v);
          '

      - name: Commit bumped version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          git commit -m "chore: bump version to ${{ steps.ver.outputs.version }}" || echo "nothing to commit"
          git push

      - name: Build (frontend + Tauri, no installer bundle)
        run: |
          npm run build
          npm run tauri build -- --no-bundle

      - name: Assemble portable package
        run: |
          mkdir -p dist-portable
          cp "src-tauri/target/release/PetBuddy.exe" dist-portable/
          # Tauri v2 运行时需要旁边的 resources 目录（图标/资源）
          if [ -d "src-tauri/target/release/resources" ]; then
            cp -r "src-tauri/target/release/resources" dist-portable/
          fi
          7z a -tzip "PetBuddy-v${{ steps.ver.outputs.version }}-win.zip" ./dist-portable/*

      - name: Upload artifact (versioned)
        uses: actions/upload-artifact@v4
        with:
          name: PetBuddy-v${{ steps.ver.outputs.version }}-win
          path: PetBuddy-v${{ steps.ver.outputs.version }}-win.zip
          if-no-files-found: error
