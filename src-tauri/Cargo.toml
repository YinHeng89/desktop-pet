[package]
name = "petbuddy"
version = "0.1.10"
description = "PetBuddy — 跨平台桌面宠物 + 通用通知接收器"
authors = ["PetBuddy"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api 用于透明无边框窗口；tray-icon 启用系统托盘
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png", "image-ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 外部宠物导入：zip 解压
zip = { version = "2", default-features = false, features = ["deflate"] }
# 在线画廊：拉取 awesome-codex-pet 索引与宠物包（纯 rustls，不依赖系统 TLS）
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# 外部链接：用系统默认程序打开（浏览器）
open = "5"
# Windows 透明窗口鼠标穿透（SetWindowRgn 区域裁切）：仅 Windows 编译使用。
# 版本与 tauri v2 内部 windows-sys 对齐（0.52），避免重复拉取不同版本。
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSApplication", "NSRunningApplication"] }
objc2-service-management = { version = "0.3", features = ["SMAppService"] }

[profile.release]
panic = "abort"
codegen-units = 4
lto = "thin"
opt-level = 3
strip = true
